[package]
name = "memory-bread-desktop"
version = "0.2.0"
description = "记忆面包 Desktop Application"
authors = ["记忆面包 Team"]
edition = "2021"

[features]
default = []
# App Store 构建禁用透明 WebView 私有 API 与 LaunchAgent 开机启动。
app-store = []

[lib]
name = "memory_bread_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
uuid = { version = "1", features = ["v4"] }
xcap = "0.8"
base64 = "0.22"
rfd = "0.15"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSControl", "NSDockTile", "NSEvent", "NSImage", "NSImageView", "NSResponder", "NSRunningApplication", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
