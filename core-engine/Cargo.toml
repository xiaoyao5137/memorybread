[package]
name        = "memory-bread-core"
version     = "0.1.0"
edition     = "2021"
description = "记忆面包 core engine — capture, storage, executor, API server"

[[bin]]
name = "memory-bread"
path = "src/main.rs"

[lib]
name = "memory_bread_core"
path = "src/lib.rs"

[dependencies]
# SQLite
rusqlite   = { version = "0.31", features = ["bundled"] }

# 异步运行时
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# 序列化
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# 客户端快照加密
aes-gcm    = "0.10"
base64     = "0.22"

# Hash
sha2       = "0.10"

# 错误处理
thiserror  = "1"
anyhow     = "1"

# 日志
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IPC 协议（共享 crate）
memory-bread-ipc = { path = "../shared/ipc-protocol/rust" }

# 时间
chrono     = { version = "0.4", features = ["serde"] }

# 截图（xcap：跨平台，直接返回 image::RgbaImage）
xcap       = "0.8"

# 图片处理（JPEG 编码）
image      = { version = "0.25", default-features = false, features = ["jpeg"] }

# REST API
axum       = "0.7"
tower      = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# HTTP 客户端
reqwest    = { version = "0.11", features = ["json", "stream"] }

# 异步流
async-stream = "0.3"
futures = "0.3"

# 键鼠自动化
enigo      = "0.2"

# UUID 生成
uuid       = { version = "1", features = ["v4"] }

# Cron 表达式解析
cron       = "0.12"

# 系统资源监控
sysinfo    = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
# 只读全局输入事件监听：仅接收事件类型，不读取或保存键值。
core-foundation = "0.9"
core-graphics = "0.23"

[dev-dependencies]
tokio          = { version = "1", features = ["full"] }
tempfile       = "3"
http-body-util = "0.1"
