[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name            = "memory-bread-sidecar"
version         = "0.1.0"
description     = "记忆面包 AI 推理 Sidecar（OCR / ASR / VLM / Embedding / RAG）"
requires-python = ">=3.9"
dependencies    = [
    "memory-bread-ipc",
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = [
    ".",                         # 让 pytest 能找到 ocr/, dispatcher.py 等顶层模块
    "../shared/ipc-protocol/python", # 使用仓库内 IPC 协议包，不依赖 editable install
]
markers = [
    "initialization_cold: 可重复执行的纯本地冷初始化沙箱测试",
    "live_initialization: 下载真实运行时与模型的手工/夜间冷初始化测试",
    "live_data_facts: 使用本地真实模型执行时间线数据事实金标回归",
]
